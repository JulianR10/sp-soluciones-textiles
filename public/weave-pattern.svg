<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">
  <defs>
    <pattern id="weave" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Warp threads (vertical) -->
      <line x1="16" y1="0" x2="16" y2="80" stroke="#FF9025" stroke-width="1" opacity="0.07"/>
      <line x1="48" y1="0" x2="48" y2="80" stroke="#FF9025" stroke-width="1" opacity="0.07"/>

      <!-- Weft threads (horizontal) -->
      <line x1="0" y1="16" x2="80" y2="16" stroke="#FF9025" stroke-width="1" opacity="0.05"/>
      <line x1="0" y1="48" x2="80" y2="48" stroke="#FF9025" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#weave)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120">
  <defs>
    <pattern id="stitch" width="160" height="120" patternUnits="userSpaceOnUse">
      <!-- Straight stitch row -->
      <line x1="0" y1="20" x2="160" y2="20"
            stroke="#FF9025" stroke-width="0.7" stroke-dasharray="5,4" opacity="0.2"/>
      <line x1="0" y1="20" x2="160" y2="20"
            stroke="#FF9025" stroke-width="0.3" stroke-dasharray="5,4" stroke-dashoffset="2" opacity="0.12"/>

      <!-- Zigzag overlock row -->
      <polyline points="0,42 8,30 16,42 24,30 32,42 40,30 48,42 56,30 64,42 72,30 80,42 88,30 96,42 104,30 112,42 120,30 128,42 136,30 144,42 152,30 160,42"
                stroke="#FF9025" stroke-width="0.6" fill="none" opacity="0.2"/>

      <!-- Straight stitch row -->
      <line x1="0" y1="60" x2="160" y2="60"
            stroke="#FF9025" stroke-width="0.7" stroke-dasharray="3,6" opacity="0.18"/>
      <line x1="0" y1="60" x2="160" y2="60"
            stroke="#FF9025" stroke-width="0.3" stroke-dasharray="3,6" stroke-dashoffset="1" opacity="0.1"/>

      <!-- Decorative scallop stitch -->
      <path d="M 0,82 Q 10,72 20,82 T 40,82 T 60,82 T 80,82 T 100,82 T 120,82 T 140,82 T 160,82"
            stroke="#FF9025" stroke-width="0.5" fill="none" opacity="0.2"/>

      <!-- Dotted straight stitch -->
      <line x1="0" y1="105" x2="160" y2="105"
            stroke="#FF9025" stroke-width="0.4" stroke-dasharray="2,4" opacity="0.15"/>

      <!-- Tiny perpendicular tie stitches -->
      <line x1="25" y1="18" x2="25" y2="22" stroke="#FF9025" stroke-width="0.4" opacity="0.12"/>
      <line x1="55" y1="18" x2="55" y2="22" stroke="#FF9025" stroke-width="0.4" opacity="0.12"/>
      <line x1="85" y1="18" x2="85" y2="22" stroke="#FF9025" stroke-width="0.4" opacity="0.12"/>
      <line x1="115" y1="18" x2="115" y2="22" stroke="#FF9025" stroke-width="0.4" opacity="0.12"/>
      <line x1="145" y1="18" x2="145" y2="22" stroke="#FF9025" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#stitch)"/>
</svg>
